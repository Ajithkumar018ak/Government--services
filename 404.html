
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Page Not Found - CivicConnect</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --navy:#07172b;
    --navy2:#102a47;
    --blue:#1769aa;
    --light-blue:#64b5f6;
    --saffron:#f28c28;
    --white:#fff;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'DM Sans',sans-serif;
    background:#061426;
    color:#fff;
}

/* =========================================
   MAIN SCREEN
========================================= */

.page{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    overflow:hidden;
    isolation:isolate;
    background:
        radial-gradient(ellipse at 50% 70%,rgba(28,113,183,.2),transparent 50%),
        linear-gradient(145deg,#061326,#102943 55%,#061326);
}

.background-grid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:60px 60px;
    opacity:.4;
    mask-image:linear-gradient(to bottom,transparent,black,transparent);
}

.ambient{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:rgba(30,120,200,.13);
    filter:blur(110px);
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
}

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(2px 2px at 10% 20%,#fff,transparent),
        radial-gradient(2px 2px at 80% 15%,#fff,transparent),
        radial-gradient(1px 1px at 30% 70%,#fff,transparent),
        radial-gradient(2px 2px at 90% 65%,#fff,transparent),
        radial-gradient(1px 1px at 60% 30%,#fff,transparent),
        radial-gradient(2px 2px at 20% 85%,#fff,transparent);
    opacity:.45;
}

/* =========================================
   CINEMATIC SCENE
========================================= */

.scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1200px;
    transform-style:preserve-3d;
    z-index:2;
}

/* PARLIAMENT BUILDING */

.building-container{
    position:absolute;
    width:540px;
    height:440px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    transform-style:preserve-3d;
    transition:
        transform 1.7s cubic-bezier(.2,.75,.2,1),
        opacity 1s ease;
}

.building{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
}

/* DOME */

.dome{
    position:absolute;
    width:150px;
    height:110px;
    left:50%;
    top:10px;
    transform:translateX(-50%);
    border-radius:80px 80px 0 0;
    background:linear-gradient(
        90deg,
        #788da3,
        #e8edf2 25%,
        #aab9c8 65%,
        #657b92
    );
    clip-path:polygon(50% 0,100% 100%,0 100%);
    filter:drop-shadow(0 0 18px rgba(255,255,255,.15));
}

.dome-top{
    position:absolute;
    width:13px;
    height:40px;
    background:linear-gradient(90deg,#8094a9,#fff,#7d91a7);
    top:-25px;
    left:50%;
    transform:translateX(-50%);
}

.dome-base{
    position:absolute;
    width:185px;
    height:12px;
    left:50%;
    top:106px;
    transform:translateX(-50%);
    background:linear-gradient(#f5f8fb,#71869b);
}

/* ROOF */

.roof{
    position:absolute;
    width:470px;
    height:42px;
    top:112px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(180deg,#edf2f6,#8fa1b3);
    clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.roof-detail{
    position:absolute;
    width:485px;
    height:10px;
    top:149px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(90deg,#60758b,#e9eff5,#647a90);
}

/* BODY */

.building-body{
    position:absolute;
    width:460px;
    height:170px;
    top:157px;
    left:50%;
    transform:translateX(-50%);
    border:3px solid #a9b8c7;
    background:linear-gradient(
        90deg,
        #788da2,
        #dce5ed 20%,
        #bdcad7 70%,
        #71869c
    );
    box-shadow:
        inset 0 0 35px rgba(0,0,0,.15),
        0 25px 40px rgba(0,0,0,.35);
}

/* COLUMNS */

.columns{
    position:absolute;
    inset:12px 12px 0;
    display:flex;
    justify-content:space-between;
}

.column{
    width:24px;
    height:155px;
    position:relative;
    background:linear-gradient(
        90deg,
        #6e8399,
        #f2f5f8 45%,
        #8499ad
    );
    box-shadow:4px 0 8px rgba(0,0,0,.15);
}

.column::before,
.column::after{
    content:"";
    position:absolute;
    left:-5px;
    width:34px;
    height:9px;
    background:linear-gradient(#fff,#899daf);
}

.column::before{top:0}
.column::after{bottom:0}

/* =========================================
   MAIN PARLIAMENT DOORS
========================================= */

.door-frame{
    position:absolute;
    width:116px;
    height:145px;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    background:#041426;
    border:6px solid #d7e1ea;
    border-bottom:0;
    perspective:900px;
    z-index:5;
    overflow:visible;
}

.door-inside{
    position:absolute;
    inset:0;
    background:
        radial-gradient(ellipse at center,rgba(71,173,255,.9),transparent 70%),
        #092849;
    opacity:0;
    transition:opacity 1.4s ease .6s;
}

.door-leaf{
    position:absolute;
    top:0;
    height:100%;
    width:50%;
    background:linear-gradient(90deg,#0b3153,#1b5984,#092642);
    border:3px solid #9ab4cb;
    transform-style:preserve-3d;
    transition:transform 1.8s cubic-bezier(.7,0,.2,1);
    z-index:3;
}

.door-leaf.left{
    left:0;
    transform-origin:left center;
}

.door-leaf.right{
    right:0;
    transform-origin:right center;
}

.door-leaf::before{
    content:"";
    position:absolute;
    inset:10px 5px;
    border:2px solid rgba(255,255,255,.28);
}

.door-leaf::after{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    top:50%;
    right:6px;
    background:#ffbd64;
    box-shadow:0 0 12px #ffbd64;
}

.door-leaf.right::after{
    right:auto;
    left:6px;
}

.door-frame.open .door-leaf.left{
    transform:rotateY(-112deg);
}

.door-frame.open .door-leaf.right{
    transform:rotateY(112deg);
}

.door-frame.open .door-inside{
    opacity:1;
}

/* STEPS */

.steps{
    position:absolute;
    width:200px;
    height:18px;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(#e6edf4,#8296aa);
    box-shadow:
        0 12px 0 #5d7289,
        0 24px 0 #40566e,
        0 36px 0 #263e58;
}

/* BUILDING LIGHT */

.building-light{
    position:absolute;
    width:500px;
    height:140px;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(40,144,232,.23);
    filter:blur(70px);
}

/* FLOOR */

.floor{
    position:absolute;
    width:100%;
    height:180px;
    bottom:-60px;
    left:0;
    background:
        linear-gradient(transparent,rgba(35,120,190,.15)),
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.05) 0 1px,
            transparent 1px 100px
        );
    transform:perspective(400px) rotateX(65deg);
    transform-origin:bottom;
}

/* BUILDING LABEL */

.building-label{
    position:absolute;
    top:calc(50% + 245px);
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:5px;
    color:#a5b9cd;
    white-space:nowrap;
    text-transform:uppercase;
    transition:opacity .4s;
}

/* =========================================
   ZOOM TRANSITION
========================================= */

.zoom-flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    z-index:20;
    pointer-events:none;
}

.zoom-overlay{
    position:absolute;
    inset:0;
    z-index:15;
    background:
        radial-gradient(circle at center,#318bd0 0%,#0b2948 45%,#061426 100%);
    opacity:0;
    transform:scale(.02);
    border-radius:50%;
    pointer-events:none;
}

.scene.zooming .building-container{
    transform:translate(-50%,-50%) scale(5.5);
    opacity:.1;
    filter:brightness(1.8);
}

.scene.zooming .building-label{
    opacity:0;
}

.scene.zooming .zoom-overlay{
    opacity:1;
    transform:scale(4);
    transition:
        transform 1.7s cubic-bezier(.3,.1,.1,1),
        opacity 1s ease;
}

/* =========================================
   404 PAGE - HIDDEN FIRST
========================================= */

.error-screen{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    text-align:center;
    opacity:0;
    visibility:hidden;
    transform:scale(.7);
    background:
        radial-gradient(ellipse at 50% 65%,rgba(23,105,170,.24),transparent 55%),
        linear-gradient(145deg,#07172b,#102a47 55%,#061426);
}

.error-screen.show{
    visibility:visible;
    animation:pageReveal 1.3s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes pageReveal{
    0%{
        opacity:0;
        transform:scale(1.25);
        filter:blur(18px);
    }
    100%{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

.error-screen::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.15;
    background-image:
        linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:60px 60px;
}

.error-content{
    position:relative;
    z-index:2;
    max-width:750px;
    width:100%;
}

/* SMALL LABEL */

.error-label{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:10px 17px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50px;
    background:rgba(255,255,255,.06);
    color:#b9cce0;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.error-label span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#f28c28;
    box-shadow:0 0 12px #f28c28;
}

/* 404 NUMBER */

.error-code{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    font-family:'Manrope',sans-serif;
    font-size:clamp(120px,20vw,210px);
    line-height:.9;
    font-weight:800;
    letter-spacing:-12px;
    color:#fff;
    text-shadow:
        0 5px 0 #a8bacd,
        0 10px 0 #71869c,
        0 18px 0 #405b78,
        0 28px 35px rgba(0,0,0,.45);
}

.error-code span{
    display:inline-block;
    animation:numberFloat 3s ease-in-out infinite;
}

.error-code span:nth-child(2){
    animation-delay:.4s;
}

.error-code span:nth-child(3){
    animation-delay:.8s;
}

@keyframes numberFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

.error-heading{
    font-family:'Manrope',sans-serif;
    font-size:clamp(24px,4vw,38px);
    font-weight:800;
    letter-spacing:4px;
    margin-top:25px;
    color:#fff;
}

.error-description{
    max-width:480px;
    margin:17px auto 0;
    color:#aebfd1;
    font-size:15px;
    line-height:1.9;
}

/* =========================================
   3D HOME BUTTON
========================================= */

.button-area{
    margin-top:38px;
    perspective:900px;
}

.home-button{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    min-width:235px;
    padding:19px 32px;
    text-decoration:none;
    color:#fff;
    font-size:13px;
    font-weight:800;
    letter-spacing:1.5px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.45);
    background:linear-gradient(135deg,#3098e4,#1769aa 55%,#0b477c);
    box-shadow:
        0 7px 0 #07365f,
        0 13px 0 #052746,
        0 23px 35px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.5);
    transform-style:preserve-3d;
    transition:transform .3s ease,box-shadow .3s ease;
    overflow:hidden;
}

.home-button::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:70%;
    height:100%;
    transform:skewX(-25deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    transition:left .7s ease;
}

.home-button:hover::before{
    left:150%;
}

.home-button:hover{
    transform:translateY(-7px) rotateX(8deg);
    box-shadow:
        0 12px 0 #07365f,
        0 18px 0 #052746,
        0 30px 40px rgba(0,0,0,.4);
}

.home-button:active{
    transform:translateY(8px);
    box-shadow:0 2px 0 #07365f,0 5px 10px rgba(0,0,0,.3);
}

.home-button i{
    font-size:16px;
}

.footer-note{
    margin-top:35px;
    color:#748ba4;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
}

/* REPLAY BUTTON */

.replay-button{
    position:absolute;
    bottom:25px;
    right:25px;
    z-index:30;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.07);
    color:#d3e0ed;
    padding:12px 18px;
    border-radius:50px;
    font-size:12px;
    cursor:pointer;
    transition:.3s;
}

.replay-button:hover{
    background:rgba(255,255,255,.15);
}

.replay-button i{
    margin-right:7px;
}

/* LOADING INDICATOR */

.loading-text{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    z-index:8;
    color:#a9bfd5;
    font-size:10px;
    letter-spacing:4px;
    text-transform:uppercase;
    white-space:nowrap;
    animation:loadingPulse 1.2s ease infinite;
}

@keyframes loadingPulse{
    50%{opacity:.35}
}

/* HOME TRANSITION */

.exit-transition{
    position:fixed;
    inset:0;
    z-index:100;
    background:#061426;
    clip-path:circle(0% at 50% 50%);
    pointer-events:none;
    transition:clip-path 1s cubic-bezier(.7,0,.2,1);
}

.exit-transition.active{
    clip-path:circle(150% at 50% 50%);
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:650px){

    .building-container{
        width:420px;
        height:380px;
        transform:translate(-50%,-50%) scale(.76);
    }

    .building-label{
        top:calc(50% + 175px);
        font-size:9px;
        letter-spacing:3px;
    }

    .error-content{
        padding:10px;
    }

    .error-code{
        font-size:clamp(100px,27vw,145px);
        gap:8px;
        letter-spacing:-8px;
    }

    .error-heading{
        font-size:24px;
        letter-spacing:2px;
    }

    .error-description{
        max-width:340px;
        font-size:13px;
    }

    .error-label{
        font-size:9px;
        letter-spacing:2px;
    }

    .button-area{
        margin-top:30px;
    }

    .home-button{
        min-width:210px;
        padding:17px 23px;
        font-size:12px;
    }

    .footer-note{
        font-size:9px;
        letter-spacing:2px;
    }

    .replay-button{
        right:12px;
        bottom:12px;
        padding:10px 13px;
        font-size:10px;
    }

    .loading-text{
        bottom:55px;
        font-size:9px;
        letter-spacing:2px;
    }
}

@media(max-width:380px){

    .building-container{
        transform:translate(-50%,-50%) scale(.64);
    }

    .building-label{
        top:calc(50% + 135px);
    }

    .error-code{
        font-size:100px;
    }

    .error-heading{
        font-size:21px;
    }
}

@media(max-height:650px) and (min-width:651px){

    .building-container{
        transform:translate(-50%,-50%) scale(.7);
    }

    .error-code{
        font-size:120px;
    }

    .error-heading{
        margin-top:12px;
    }

    .error-description{
        margin-top:10px;
    }

    .button-area{
        margin-top:22px;
    }

    .footer-note{
        margin-top:20px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        transition-duration:.01ms!important;
    }
}
</style>
</head>

<body>

<main class="page" id="page">

    <div class="background-grid"></div>
    <div class="ambient"></div>
    <div class="stars"></div>

    <div class="floor"></div>

    <!-- =====================================
         PARLIAMENT INTRO SCENE
    ====================================== -->

    <section class="scene" id="scene">

        <div class="building-container" id="buildingContainer">

            <div class="building-light"></div>

            <div class="building">

                <div class="dome-top"></div>
                <div class="dome"></div>
                <div class="dome-base"></div>

                <div class="roof"></div>
                <div class="roof-detail"></div>

                <div class="building-body">

                    <div class="columns">
                        <span class="column"></span>
                        <span class="column"></span>
                        <span class="column"></span>
                        <span class="column"></span>
                        <span class="column"></span>
                        <span class="column"></span>
                        <span class="column"></span>
                        <span class="column"></span>
                    </div>

                    <div class="door-frame" id="doorFrame">

                        <div class="door-inside"></div>

                        <div class="door-leaf left"></div>
                        <div class="door-leaf right"></div>

                    </div>

                </div>

                <div class="steps"></div>

            </div>

        </div>

        <div class="building-label" id="buildingLabel">
            THE PARLIAMENT · CIVICCONNECT
        </div>

        <div class="zoom-overlay" id="zoomOverlay"></div>

    </section>

    <!-- =====================================
         404 PAGE - REVEALS AFTER ZOOM
    ====================================== -->

    <section class="error-screen" id="errorScreen">

        <div class="error-content">

            <div class="error-label">
                <span></span>
                SYSTEM MESSAGE · 404 ERROR
            </div>

            <div class="error-code">
                <span>4</span>
                <span>0</span>
                <span>4</span>
            </div>

            <h1 class="error-heading">
                PAGE NOT FOUND
            </h1>

            <p class="error-description">
                Oops! The page you are looking for seems to have
                disappeared. It may have been moved, removed,
                or is temporarily unavailable.
            </p>

            <div class="button-area">

                <a href="index.html" class="home-button" id="homeButton">
                    <i class="fa-solid fa-house"></i>
                    BACK TO HOME
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

            </div>

            <div class="footer-note">
                <i class="fa-solid fa-landmark"></i>
                &nbsp; CIVICCONNECT · DIGITAL INDIA
            </div>

        </div>

    </section>

    <div class="loading-text" id="loadingText">
        ENTERING CIVICCONNECT
    </div>

    <button class="replay-button" id="replayButton">
        <i class="fa-solid fa-rotate-right"></i>
        Replay
    </button>

</main>

<div class="exit-transition" id="exitTransition"></div>

<script>

/* =========================================
   ELEMENTS
========================================= */

const scene = document.getElementById("scene");
const doorFrame = document.getElementById("doorFrame");
const errorScreen = document.getElementById("errorScreen");
const loadingText = document.getElementById("loadingText");
const replayButton = document.getElementById("replayButton");
const homeButton = document.getElementById("homeButton");
const exitTransition = document.getElementById("exitTransition");

let timers = [];
let isAnimating = false;

/* =========================================
   CLEAR TIMERS
========================================= */

function clearTimers(){

    timers.forEach(timer => clearTimeout(timer));

    timers = [];

}

/* =========================================
   FULL CINEMATIC INTRO
========================================= */

function startIntro(){

    clearTimers();

    isAnimating = true;

    // Reset everything
    doorFrame.classList.remove("open");

    scene.classList.remove("zooming");

    errorScreen.classList.remove("show");

    errorScreen.style.display = "flex";

    loadingText.style.display = "block";

    // STEP 1: Show Parliament
    loadingText.textContent = "WELCOME TO CIVICCONNECT";

    // STEP 2: Open Parliament doors
    timers.push(setTimeout(() => {

        doorFrame.classList.add("open");

        loadingText.textContent = "OPENING THE MAIN ENTRANCE";

    },1500));

    // STEP 3: Camera starts entering the building
    timers.push(setTimeout(() => {

        loadingText.textContent = "ENTERING CIVICCONNECT";

        scene.classList.add("zooming");

    },3400));

    // STEP 4: Complete zoom and reveal 404 page
    timers.push(setTimeout(() => {

        scene.style.display = "none";

        errorScreen.classList.add("show");

        loadingText.style.display = "none";

        isAnimating = false;

    },5200));

}

/* =========================================
   REPLAY
========================================= */

replayButton.addEventListener("click",function(){

    if(isAnimating) return;

    scene.style.display = "flex";

    scene.style.transition = "none";

    scene.classList.remove("zooming");

    doorFrame.classList.remove("open");

    errorScreen.classList.remove("show");

    loadingText.style.display = "block";

    // Allow reset styles to apply
    void scene.offsetWidth;

    scene.style.transition = "";

    startIntro();

});

/* =========================================
   HOME BUTTON TRANSITION
========================================= */

homeButton.addEventListener("click",function(event){

    event.preventDefault();

    exitTransition.classList.add("active");

    setTimeout(() => {

        window.location.href = "index.html";

    },950);

});

/* =========================================
   START ON PAGE LOAD
========================================= */

window.addEventListener("load",function(){

    startIntro();

});

</script>
